name: Sync upstream

on:
  schedule:
    - cron: '30 1 * * 3'
  workflow_dispatch:
    inputs:
      target_branch:
        description: Target branch to update
        required: true
        default: main
        type: string
      upstream_repository:
        description: Upstream repository in OWNER/REPOSITORY form
        required: true
        default: iDvel/rime-ice
        type: string
      upstream_branch:
        description: Upstream branch to merge
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ inputs.target_branch || 'main' }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'LIPiston/rime-ice'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.target_branch || 'main' }}
      UPSTREAM_REPOSITORY: ${{ inputs.upstream_repository || 'iDvel/rime-ice' }}
      UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'main' }}

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || 'main' }}
          fetch-depth: 0

      - name: Configure remotes and Git identity
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          upstream_url="https://github.com/${UPSTREAM_REPOSITORY}.git"
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "$upstream_url"
          else
            git remote add upstream "$upstream_url"
          fi

          git fetch --no-tags upstream \
            "refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"
          git fetch --no-tags origin \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"

      - name: Merge upstream
        id: merge
        run: |
          set -euo pipefail

          upstream_ref="refs/remotes/upstream/${UPSTREAM_BRANCH}"
          merge_base="$(git merge-base HEAD "$upstream_ref")"
          upstream_tip="$(git rev-parse "$upstream_ref")"
          if [ "$merge_base" = "$upstream_tip" ]; then
            echo "目标分支已包含上游 ${UPSTREAM_REPOSITORY}:${UPSTREAM_BRANCH}，无需同步。"
            echo 'needs_sync=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          merge_status=0
          git merge --no-ff --no-commit "$upstream_ref" || merge_status=$?

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | LC_ALL=C sort)"
            if [ "$conflicts" = 'README.md' ]; then
              git checkout --ours README.md && git add README.md
            elif [ -n "$conflicts" ]; then
              echo '未解决的合并冲突文件：'
              printf '%s\n' "$conflicts"
              git merge --abort || true
              exit 1
            else
              echo "git merge 失败，退出状态：${merge_status}" >&2
              exit "$merge_status"
            fi
          fi

          echo 'needs_sync=true' >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.merge.outputs.needs_sync == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: others/script/go.mod
          cache-dependency-path: others/script/go.sum

      - name: Build and check
        if: steps.merge.outputs.needs_sync == 'true'
        run: |
          set -euo pipefail
          make -C others/script/ build
          git diff --check

      - name: Commit and push
        if: steps.merge.outputs.needs_sync == 'true'
        run: |
          set -euo pipefail

          git add -A
          if git diff --cached --quiet; then
            echo '没有文件变更，跳过提交和推送。'
            git merge --abort || true
            exit 0
          fi

          git commit -m "chore(sync): 同步上游 $(date -u +'%Y-%m-%d')"
          git push origin "HEAD:${TARGET_BRANCH}"
